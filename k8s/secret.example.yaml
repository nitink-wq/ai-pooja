# Template only — never commit a real secret. On Devtron use the GUI secret
# ({project}-{app} naming) with envFrom into the workload instead.
apiVersion: v1
kind: Secret
metadata:
  name: ai-pooja-secrets
type: Opaque
stringData:
  # Must be identical on every replica (see README, "Payment -> call handoff").
  PAY_TOKEN_SECRET: replace-me-with-a-long-random-string
  RAZORPAY_KEY_ID: replace-me
  RAZORPAY_KEY_SECRET: replace-me
  ANAM_API_KEY: replace-me
  ANAM_PERSONA_ID: replace-me
  ANAM_VOICE_ID: replace-me
  ANAM_VOICE_MODEL_ID: replace-me
